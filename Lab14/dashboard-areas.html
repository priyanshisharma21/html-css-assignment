<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; }
.dashboard {
  display: grid;
  grid-template-columns: 200px 1fr;
  grid-template-rows: auto 1fr auto;
  grid-template-areas:
    "header header"
    "sidebar main"
    "footer footer";
  height: 400px;
}
.header { grid-area: header; background-color: #1d3557; color: #fff; padding: 16px; }
.sidebar { grid-area: sidebar; background-color: #a8dadc; padding: 16px; }
.main { grid-area: main; background-color: #f1faee; padding: 16px; }
.footer { grid-area: footer; background-color: #457b9d; color: #fff; padding: 16px; }
</style>
</head>
<body>
<div class="dashboard">
  <div class="header">Header</div>
  <div class="sidebar">Sidebar</div>
  <div class="main">Main</div>
  <div class="footer">Footer</div>
</div>
</body>
</html>
