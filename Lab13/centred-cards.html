<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centred Cards</title>
<style>
body { font-family: Arial, sans-serif; }
.row { display: flex; justify-content: center; align-items: center; gap: 20px; height: 300px; background-color: #e9ecef; }

.card { width: 160px; padding: 16px; border: 2px solid #1d3557; border-radius: 12px; background-color: #f1faee; text-align: center; }
</style>
</head>
<body>
<div class="row">
  <div class="card"><h3>Starter</h3><p>199</p></div>
  <div class="card"><h3>Standard</h3><p>349</p></div>
  <div class="card"><h3>Premium</h3><p>499</p></div>
</div>
</body>
</html>
