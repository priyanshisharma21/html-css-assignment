<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile First</title>
<style>
body { font-family: Arial, sans-serif; padding: 16px; }
.card { background-color: #f1faee; border: 2px solid #1d3557; border-radius: 12px; padding: 16px; margin-bottom: 16px; }

@media (min-width: 600px) {
  .cards { display: flex; gap: 16px; }
  .card { flex: 1; }
}
</style>
</head>
<body>
<div class="cards">
  <div class="card">
    <h2>Card One</h2>
    <p>On a phone this card stacks above the next one.</p>
  </div>
  <div class="card">
    <h2>Card Two</h2>
    <p>From 600px wide the cards sit side by side.</p>
  </div>
</div>
</body>
</html>
